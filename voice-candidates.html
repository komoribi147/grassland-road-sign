<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>年龄与情绪 · 角色配音新样音</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#14201a;color:#e9e3d5;font:16px/1.8 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1050px;margin:auto;padding:45px 26px 70px}.eyebrow{font-size:12px;letter-spacing:.22em;color:#b5c5a7}h1{font:38px/1.5 serif;margin:12px 0}h2{font:26px/1.5 serif;margin:4px 0}.note{color:#a6b2a6;font-size:14px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:26px 0}.card{border:1px solid #405144;background:#1e3025;padding:25px;border-radius:7px}.age{font-size:13px;color:#c2c9a5}.quote{font:21px/1.9 serif;min-height:120px;border-left:2px solid #8d9d77;padding-left:16px}audio{width:100%;margin:8px 0}a{color:#b7caaa}label{display:block;font-size:13px;color:#b3bfac}.old{opacity:.7}header{border-bottom:1px solid #405144;padding-bottom:22px}.intent{min-height:54px;color:#b7c5b2;font-size:14px}@media(max-width:650px){.cards{grid-template-columns:1fr}h1{font-size:29px}.quote{min-height:0}}</style></head><body><main><header><div class="eyebrow">草地上的路标 / 角色配音 · 第二轮</div><h1>先听年龄，再听情绪</h1><p class="note">这一轮按角色的年龄、气息、说话对象和情绪设计声音。这里保留参考声线供比较；完整剧情已接入 132 处配音，何大姐采用已确认的朴实关切版。</p></header><p class="note" id="status" role="status">正在读取新样音…</p><section class="cards" id="cards"></section><p class="note">年龄感和表演是否贴合，需要由试听判断；模型支持情绪指令，不代表每段生成都能准确表现。</p><a href="voice-preview.html">返回第一版与自由对话试听 →</a></main><script type="module">
const status=document.getElementById('status'),box=document.getElementById('cards');
const intent={'li-changhe':'疲惫、粗粝的成熟男声。面对受伤的年轻人，坚定里带着关心。','shitou':'变声期后的少年声。前一句逞强，迟疑时露出害怕。','he-xiuying':'25 岁成年女声。朴实、耐心地照看伤员，日常语气，句尾自然收稳。','he-xiuying-old':'70 多岁的声音目标。气息较弱、声音带颗粒，回忆时克制而有牵挂。'};
try{const res=await fetch('assets/audio/voice-candidates/manifest.json',{cache:'no-store'});if(!res.ok)throw Error();const data=await res.json();const old=await fetch('assets/audio/voices/manifest.json').then(r=>r.json()).catch(()=>({clips:[]}));
for(const c of data.clips){const card=document.createElement('article');card.className='card';const age=document.createElement('div');age.className='age';age.textContent=c.age;const title=document.createElement('h2');title.textContent=c.name;const desc=document.createElement('p');desc.className='intent';desc.textContent=intent[c.npc];const quote=document.createElement('p');quote.className='quote';quote.textContent=c.sample;const label=document.createElement('label');label.textContent='新样音 · 年龄与情绪设计';const audio=document.createElement('audio');audio.controls=true;audio.preload='metadata';audio.src=c.url;card.append(age,title,desc,quote,label,audio);if(c.previousUrl){const l=document.createElement("label");l.textContent="上一版 · 同一句台词对比";const a=document.createElement("audio");a.controls=true;a.preload="none";a.src=c.previousUrl;card.append(l,a)}let previous=old.clips.find(x=>x.npc===c.npc&&x.text===old.profiles?.[c.npc]?.sample);const baseline=`assets/audio/voice-candidates/${c.npc}-edge-baseline.mp3`;if((await fetch(baseline,{method:'HEAD'})).ok)previous={url:baseline,sameText:true};if(previous){const l=document.createElement('label');l.textContent=previous.sameText?'第一版 · 同一句台词对比':'第一版 · 对比试听';const a=document.createElement('audio');a.controls=true;a.preload='none';a.src=previous.url;a.className='old';card.append(l,a)}box.append(card)}document.addEventListener('play',e=>{if(e.target.tagName==='AUDIO')for(const audio of document.querySelectorAll('audio'))if(audio!==e.target)audio.pause()},true);document.addEventListener('visibilitychange',()=>{if(document.hidden)for(const audio of document.querySelectorAll('audio'))audio.pause()});status.textContent=`已准备 ${data.clips.length} 个角色新样音。先比较老班长与石头，再听何大姐的青年声和晚年声。`;
}catch{status.textContent='新样音尚在生成，完成后刷新即可试听。'}
</script></body></html>
