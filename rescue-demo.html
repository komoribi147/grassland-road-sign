    </section>

      <div class="dialogue" aria-live="polite" aria-atomic="true">

        <p class="line" id="line">先站稳！踩住这块草甸，抓牢绑腿布。</p>
      </div>

        <button class="primary" id="gripButton" type="button">站稳，抓牢绑腿布 <span aria-hidden="true">↗</span></button>

        </button>
        <button class="alternative" id="assistButton" type="button" aria-pressed="false" hidden>点一下，持续协力</button>
        <button class="primary" id="replayButton" type="button" hidden>再体验一次 <span aria-hidden="true">↺</span></button>
